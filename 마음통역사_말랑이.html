<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>마음 통역사 말랑이</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;600;700;800&family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  /* 말랑이: 살구빛 말랑한 캐릭터 + 차분한 청록 행동색. 학생은 한 화면에 한 질문, 교사는 요약 → 상세 */
  --bg:#EDF4F1;
  --surface:#FFFFFF;
  --ink:#16302D;
  --muted:#4C6763;
  --line:#CFE0DB;
  --accent:#0B7A6E;
  --accent-soft:#DCF1EC;
  --peach:#FFB899;
  --blush:#FF7F7A;
  --warn:#8F4C00;
  --warn-soft:#FFF0D9;
  --danger:#B3261E;
  --danger-soft:#FDE8E6;
  --u1:#2563C9; /* ① 있었던 일: 곧은 밑줄 */
  --u2:#C8327A; /* ② 내 기분: 물결 밑줄 */
  --u3:#0F8A5F; /* ③ 부탁: 두 줄 밑줄 */
  --font-display:"Jua","Gothic A1","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-body:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.55;-webkit-text-size-adjust:100%;word-break:keep-all;overflow-wrap:anywhere}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
h1,h2,h3{text-wrap:balance}
#app{min-height:100%;display:flex;flex-direction:column}

/* ---------- 나-전달법 밑줄 ---------- */
.u1,.u2,.u3{text-decoration-line:underline;text-underline-offset:.3em;text-decoration-skip-ink:none;-webkit-text-decoration-line:underline}
.u1{text-decoration-style:solid;text-decoration-color:var(--u1);text-decoration-thickness:3px}
.u2{text-decoration-style:wavy;text-decoration-color:var(--u2);text-decoration-thickness:2px}
.u3{text-decoration-style:double;text-decoration-color:var(--u3);text-decoration-thickness:3px}
.legend-mini{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:15px;font-weight:800;line-height:2}
.legend-mini .u1{color:var(--u1)}.legend-mini .u2{color:var(--u2)}.legend-mini .u3{color:var(--u3)}
.legend{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.legend li{display:grid;grid-template-columns:118px 1fr;gap:10px;align-items:baseline;font-size:16.5px;font-weight:600;line-height:1.6}
.legend .tag{font-weight:800;white-space:nowrap;line-height:2}
.legend .tag .u1{color:var(--u1)}.legend .tag .u2{color:var(--u2)}.legend .tag .u3{color:var(--u3)}
.legend small{display:block;color:var(--muted);font-size:14.5px}
@media (max-width:480px){.legend li{grid-template-columns:1fr;gap:0}}

/* ---------- 공통 버튼 ---------- */
.btn{font-weight:700;font-size:19px;min-height:60px;padding:0 26px;border-radius:999px;border:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s ease,background .15s ease;text-align:center}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:disabled{background:#A7C3BE;cursor:not-allowed;transform:none}
.btn.ghost{background:var(--surface);border:2px solid var(--line)}
.btn.sm{min-height:44px;font-size:15.5px;padding:0 16px}
.btn.big{min-height:72px;font-size:24px;padding:0 48px;font-family:var(--font-display);font-weight:400}
.linkbtn{background:none;border:0;padding:6px 4px;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:15px}

/* ---------- 말랑이 캐릭터 ---------- */
.mascot{display:block;flex:none;overflow:visible}
.mascot .m-body{fill:var(--peach)}
.mascot.float{animation:float 4s ease-in-out infinite}
.mascot.squish{animation:squish .5s ease}
.mascot.think{animation:think 1.4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes squish{0%{transform:scale(1)}30%{transform:scale(1.12,.88)}60%{transform:scale(.95,1.06)}100%{transform:scale(1)}}
@keyframes think{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-6px) rotate(-4deg)}75%{transform:translateY(-6px) rotate(4deg)}}

/* ---------- 학생: 위 막대 ---------- */
.s-top{display:flex;align-items:center;gap:14px;padding:12px 20px;max-width:1100px;width:100%;margin:0 auto}
.brand{font-family:var(--font-display);font-size:22px;color:var(--accent);display:flex;align-items:center;gap:8px;flex:none}
.brand .me{font-family:var(--font-body);font-size:14px;font-weight:700;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:2px 10px;white-space:nowrap}
.prog{list-style:none;margin:0;padding:0;display:flex;gap:6px;flex:1;justify-content:center;align-items:center;min-width:0}
.prog li{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);font-weight:600;padding:4px 10px 4px 4px;border-radius:999px;white-space:nowrap}
.prog .d{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:2px solid var(--line);font-size:13px;font-weight:800;flex:none}
.prog li.done .d{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.prog li.now{background:var(--surface);color:var(--ink);box-shadow:0 0 0 2px var(--accent) inset}
.prog li.now .d{background:var(--accent);border-color:var(--accent);color:#fff}
.prog-space{flex:1}
@media (max-width:1180px){.prog li:not(.now) .n{display:none}.prog li{padding:4px}.prog li.now{padding-right:12px}}
@media (max-width:600px){.s-top{gap:8px;padding:10px 14px}.prog li:not(.now){display:none}.brand>span:not(.me){display:none}}

/* ---------- 학생: 본문 ---------- */
.s-main{flex:1;width:100%;max-width:1100px;margin:0 auto;padding:8px 20px 24px;display:flex;flex-direction:column;gap:18px;overflow-x:clip}
.ask{display:flex;align-items:center;gap:16px}
.ask h1{font-family:var(--font-display);font-weight:400;font-size:clamp(27px,4.2vw,42px);line-height:1.2;margin:0 0 8px}
.bubble{display:inline-block;background:var(--surface);border:2px solid var(--line);border-radius:18px 18px 18px 4px;padding:8px 14px;margin:0;color:var(--muted);font-size:17px;font-weight:600}
@media (max-width:600px){.ask .mascot{width:60px;height:56px}.bubble{font-size:15.5px}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.grid.emo{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.opt{display:flex;align-items:center;gap:14px;text-align:left;min-height:84px;padding:12px 16px;border:2.5px solid var(--line);border-radius:20px;background:var(--surface);cursor:pointer;transition:transform .12s ease,border-color .12s ease,background .12s ease}
.opt:active{transform:scale(.97)}
.opt .em{font-size:36px;line-height:1;flex:none;width:44px;text-align:center}
.opt .lb{display:block;font-weight:800;font-size:19px;line-height:1.3}
.opt .ht{display:block;font-size:14.5px;color:var(--muted);margin-top:3px;line-height:1.35}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 3px var(--accent-soft)}
.opt[aria-pressed="true"] .lb::after{content:" ✓";color:var(--accent)}
.opt.small{min-height:64px}
.opt.small .em{font-size:28px}
.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:10px}
.num{min-height:68px;border-radius:18px;border:2.5px solid var(--line);background:var(--surface);font-family:var(--font-display);font-size:30px;cursor:pointer;font-variant-numeric:tabular-nums}
.num[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.num.me{background:transparent;border-style:dashed;color:var(--muted);font-size:17px;cursor:not-allowed}
@media (max-width:600px){.nums{grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:8px}.num{min-height:58px;font-size:25px}}
.sub-h{font-weight:800;color:var(--muted);font-size:15.5px;margin:4px 0 -6px}
.s-foot{position:sticky;bottom:0;width:100%;max-width:1100px;margin:0 auto;padding:14px 20px 18px;display:flex;gap:12px;justify-content:space-between;align-items:center;background:linear-gradient(to top,var(--bg) 72%,rgba(237,244,241,0))}
.s-foot .btn.primary{min-width:220px}
@media (max-width:600px){.s-foot{padding:12px 14px 14px}.s-foot .btn{font-size:17px;padding:0 18px;min-height:56px}.s-foot .btn.primary{min-width:0;flex:1}}
.picked{display:flex;flex-wrap:wrap;gap:8px}
.picked span{background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:4px 12px;font-size:15px;font-weight:700}
.kind{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:15px;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:4px 12px;align-self:flex-start}
textarea.write{width:100%;min-height:140px;resize:vertical;border:2.5px solid var(--line);border-radius:20px;padding:16px 18px;font:inherit;font-size:21px;line-height:1.6;background:var(--surface);color:var(--ink)}
textarea.write:focus,textarea.part:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 4px var(--accent-soft)}
.w-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.counter{font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.chipbtn{border:2px dashed var(--line);background:transparent;border-radius:999px;padding:8px 14px;font-weight:700;font-size:15px;cursor:pointer;color:var(--muted)}
.note{border-radius:16px;padding:12px 16px;font-size:16px;font-weight:600;margin:0}
.note.info{background:var(--accent-soft);color:var(--ink)}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.masked-label{font-weight:800;font-size:15px;color:var(--muted);margin:0 0 -10px}
.masked{background:var(--surface);border:2.5px solid var(--line);border-radius:20px;padding:16px 20px;font-size:21px;line-height:1.7}
.masked mark,.t-test mark{background:#FFE08A;color:var(--ink);border-radius:6px;padding:0 4px;font-weight:800}
.sugs{display:flex;flex-direction:column;gap:12px}
.sug{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;border:2.5px solid var(--line);border-radius:20px;background:var(--surface);padding:14px 18px;cursor:pointer;transition:transform .12s ease}
.sug:active{transform:scale(.985)}
.sug .no{flex:none;font-family:var(--font-display);font-size:30px;color:var(--accent);line-height:1.1}
.sug .tone{display:block;font-size:13.5px;font-weight:800;color:var(--muted)}
.sug .tx{display:block;font-size:21px;line-height:1.9;font-weight:600}
.sug[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 3px var(--accent-soft)}
.parts3{display:flex;flex-direction:column;gap:12px}
.part-row{display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:start}
.part-row label{font-weight:800;font-size:17px;line-height:1.4;padding-top:12px}
.part-row label small{display:block;font-weight:600;font-size:13.5px;color:var(--muted)}
.part-row.p1 label b{color:var(--u1)}.part-row.p2 label b{color:var(--u2)}.part-row.p3 label b{color:var(--u3)}
textarea.part{width:100%;min-height:58px;resize:vertical;border:2.5px solid var(--line);border-radius:16px;padding:12px 14px;font:inherit;font-size:19px;line-height:1.5;background:var(--surface);color:var(--ink)}
.part-row.p1 textarea.part{border-left:8px solid var(--u1)}
.part-row.p2 textarea.part{border-left:8px solid var(--u2)}
.part-row.p3 textarea.part{border-left:8px solid var(--u3)}
@media (max-width:600px){.part-row{grid-template-columns:1fr;gap:4px}.part-row label{padding-top:0}}
.preview{background:var(--surface);border:2px dashed var(--line);border-radius:18px;padding:14px 18px;font-size:21px;font-weight:700;line-height:2}
.preview-h{font-weight:800;font-size:15px;color:var(--muted);margin:0 0 -8px}

/* ---------- 시작 화면 ---------- */
.start{flex:1;width:100%;max-width:900px;margin:0 auto;padding:24px 20px 20px;display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center}
.start-hero{display:flex;align-items:center;gap:28px;text-align:left}
.eyebrow{margin:0;font-weight:800;color:var(--muted);font-size:16px;letter-spacing:.08em}
.title{font-family:var(--font-display);font-weight:400;font-size:clamp(56px,10vw,92px);line-height:1;margin:2px 0 10px;color:var(--ink)}
.lead{margin:0;font-size:19px;font-weight:600;color:var(--muted)}
.how{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.how li{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:14px 12px;display:flex;align-items:center;gap:10px;text-align:left;font-weight:700;font-size:15.5px;line-height:1.4}
.how b{flex:none;width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:var(--font-display);font-weight:400;font-size:19px}
.privacy{display:flex;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--accent);border-radius:16px;padding:12px 18px;font-size:17px;text-align:left}
.privacy svg{flex:none}
.sys{font-size:14.5px;color:var(--muted);min-height:1.4em;max-width:640px}
.sys.warn{color:var(--warn);font-weight:700}
.teacher-link{margin-top:auto;background:none;border:0;color:var(--muted);font-size:14.5px;cursor:pointer;padding:10px;text-decoration:underline}
@media (max-width:640px){.start-hero{flex-direction:column;text-align:center}.how{grid-template-columns:1fr}.start .mascot.float{width:120px;height:112px}}

/* ---------- 숨 고르기 ---------- */
.breathe{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:10px 20px}
.breathe h1{font-family:var(--font-display);font-weight:400;font-size:clamp(27px,4.2vw,40px);margin:0}
.breathe p{margin:0;font-size:18px;font-weight:600;color:var(--muted)}
.breathe .mascot{animation:breathe 8s ease-in-out 3;transform-origin:50% 60%}
@keyframes breathe{0%,100%{transform:scale(1)}45%,55%{transform:scale(1.3)}}
.btxt{position:relative;height:48px;width:100%;font-family:var(--font-display);font-size:32px;color:var(--accent)}
.btxt span{position:absolute;inset:0;opacity:0}
.btxt .in{animation:bIn 8s linear 3}
.btxt .out{animation:bOut 8s linear 3}
.btxt .end{animation:bEnd .4s ease 24s forwards}
@keyframes bIn{0%,46%{opacity:1}50%,100%{opacity:0}}
@keyframes bOut{0%,49%{opacity:0}53%,96%{opacity:1}100%{opacity:0}}
@keyframes bEnd{to{opacity:1}}

/* ---------- 불러오는 중 ---------- */
.loading{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:20px}
.loading h1{font-family:var(--font-display);font-weight:400;font-size:clamp(26px,4vw,36px);margin:0}
.loading p{margin:0;color:var(--muted);font-weight:600}
.dots3{display:flex;gap:8px}
.dots3 i{width:12px;height:12px;border-radius:50%;background:var(--accent);animation:dot 1.2s ease-in-out infinite}
.dots3 i:nth-child(2){animation-delay:.2s}.dots3 i:nth-child(3){animation-delay:.4s}
@keyframes dot{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-6px)}}

/* ---------- 마음 카드 (짠! 등장) ---------- */
.reveal{position:relative;perspective:1600px;max-width:800px;width:100%;margin:18px auto 0}
.flip{position:relative;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;animation:flipIn 1.25s cubic-bezier(.2,.75,.25,1) .3s both}
@keyframes flipIn{0%{transform:translateY(60px) scale(.45) rotateY(180deg);opacity:0}35%{transform:translateY(0) scale(1.05) rotateY(180deg);opacity:1}100%{transform:scale(1) rotateY(0deg);opacity:1}}
.face{backface-visibility:hidden;-webkit-backface-visibility:hidden}
.back{position:absolute;inset:0;transform:rotateY(180deg);border-radius:26px;background:var(--accent);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#fff;font-family:var(--font-display);font-size:34px}
.zan{position:absolute;top:-24px;right:20px;z-index:3;background:#FFD54A;color:var(--ink);font-family:var(--font-display);font-size:30px;padding:4px 20px;border-radius:999px;transform:rotate(6deg);box-shadow:0 6px 16px rgba(0,0,0,.15);animation:zan .5s cubic-bezier(.3,1.6,.5,1) 1.5s both}
@keyframes zan{0%{transform:scale(0) rotate(-25deg)}100%{transform:scale(1) rotate(6deg)}}
.spark{position:absolute;left:50%;top:45%;width:0;height:0;pointer-events:none;z-index:2}
.spark i{position:absolute;left:-6px;top:-6px;width:12px;height:12px;border-radius:3px;opacity:0;animation:burst 1.1s ease-out 1.45s both}
.spark i:nth-child(3n){border-radius:50%}
@keyframes burst{0%{opacity:1;transform:translate(0,0) rotate(0) scale(.5)}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--r)) scale(1.1)}}
.mcard{background:var(--surface);border-radius:26px;overflow:hidden;box-shadow:0 14px 36px rgba(22,48,45,.16);border:2px solid var(--line)}
.mcard-top{background:var(--emo,var(--peach));padding:14px 24px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;color:var(--ink)}
.mcard-label{font-family:var(--font-display);font-size:26px}
.mcard-to{font-weight:800;font-size:16px}
.mcard-sent{margin:0;padding:26px 26px 16px;font-size:clamp(23px,3.2vw,31px);line-height:2;font-weight:800}
.mcard-chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 24px 16px}
.mcard-chips span{background:var(--bg);border-radius:999px;padding:4px 12px;font-size:14.5px;font-weight:700}
.mcard-foot{display:flex;align-items:center;gap:10px;padding:10px 24px 18px;color:var(--muted);font-weight:700;font-size:15px;border-top:2px dashed var(--line)}
.after{animation:fadeUp .6s ease 1.8s both}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.card-actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;margin:18px 0 4px}
.card-cols{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start;max-width:1000px;width:100%;margin:0 auto}
@media (max-width:820px){.card-cols{grid-template-columns:1fr}}
.boxy{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:18px 20px}
.boxy h2{font-family:var(--font-display);font-weight:400;font-size:25px;margin:0 0 6px}
.boxy .why{margin:0 0 14px;color:var(--muted);font-weight:600;font-size:15.5px}
.boxy ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px;font-size:17px;font-weight:600}
.save-st{font-weight:700;font-size:15.5px;padding:8px 14px;border-radius:14px}
.save-st.ok{background:var(--accent-soft);color:var(--accent)}
.save-st.wait{background:var(--surface);color:var(--muted)}
.save-st.fail{background:var(--warn-soft);color:var(--warn)}
.bigview{position:fixed;inset:0;z-index:70;background:var(--surface);display:flex;flex-direction:column;gap:16px;padding:20px 24px;overflow:auto}
.bigview .top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.bigview .to{font-family:var(--font-display);font-size:26px;color:var(--muted)}
.bigview .s{margin:auto 0;font-size:clamp(30px,5.4vw,56px);line-height:2;font-weight:800}

/* ---------- 멈춤 화면 ---------- */
.stop{flex:1;display:flex;align-items:center;justify-content:center;padding:24px 20px;background:#FFF7F2}
.stop-box{max-width:680px;width:100%;background:var(--surface);border-radius:28px;padding:28px 28px 22px;border:3px solid var(--peach);display:flex;flex-direction:column;gap:16px;text-align:center;align-items:center}
.stop-box h1{font-family:var(--font-display);font-weight:400;font-size:clamp(30px,5vw,44px);margin:0}
.stop-box .msg{font-size:21px;line-height:1.7;font-weight:700;margin:0}
.stop-box .st{font-weight:800;font-size:17px;padding:10px 16px;border-radius:14px}

/* SHA-256: 브라우저 암호 기능이 없을 때(파일·http로 열 때)도 같은 값이 나오도록 직접 계산 */
const K256=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
function sha256js(str){
  const bytes=new TextEncoder().encode(str),l=bytes.length;
  const buf=new Uint8Array(((l+9+63)>>6)<<6);buf.set(bytes);buf[l]=0x80;
  const dv=new DataView(buf.buffer);const bits=l*8;
  dv.setUint32(buf.length-4,bits>>>0);dv.setUint32(buf.length-8,Math.floor(bits/4294967296));
  let H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const W=new Uint32Array(64);const r=(x,n)=>(x>>>n)|(x<<(32-n));
  for(let i=0;i<buf.length;i+=64){
    for(let t=0;t<16;t++)W[t]=dv.getUint32(i+t*4);
    for(let t=16;t<64;t++){const s0=r(W[t-15],7)^r(W[t-15],18)^(W[t-15]>>>3);const s1=r(W[t-2],17)^r(W[t-2],19)^(W[t-2]>>>10);W[t]=(W[t-16]+s0+W[t-7]+s1)>>>0;}
    let a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
    for(let t=0;t<64;t++){const t1=(h+(r(e,6)^r(e,11)^r(e,25))+((e&f)^(~e&g))+K256[t]+W[t])>>>0;const t2=((r(a,2)^r(a,13)^r(a,22))+((a&b)^(a&c)^(b&c)))>>>0;h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a;a=(t1+t2)>>>0;}
    H=[(H[0]+a)>>>0,(H[1]+b)>>>0,(H[2]+c)>>>0,(H[3]+d)>>>0,(H[4]+e)>>>0,(H[5]+f)>>>0,(H[6]+g)>>>0,(H[7]+h)>>>0];
  }
  return H.map(x=>x.toString(16).padStart(8,'0')).join('');
}
async function sha(s){
  try{if(globalThis.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');}}catch(e){}
  return sha256js(s);
}
async function nameKey(n,salt){return (await sha(salt+'|name|'+n)).slice(0,20);}
function cleanName(n){return String(n||'').replace(/\s+/g,'').toLowerCase();}
function nameVariants(raw){
  const items=String(raw||'').split(/[\n,，、/]+/).map(cleanName).filter(s=>s.length>=2&&s.length<=10);
  const out=new Set();
  for(const n of items){
    out.add(n);
    if(/^[가-힣]{3}$/.test(n)&&SURNAME1.includes(n[0]))out.add(n.slice(1));
    if(/^[가-힣]{4}$/.test(n)&&SURNAME2.includes(n.slice(0,2)))out.add(n.slice(2));
  }
  return {entries:items.length,variants:Array.from(out)};
}
/* 이름·별명·번호·연락처·사는 곳을 '친구' 등으로 바꿈. 이름 목록은 해시로만 비교 */
async function maskText(text,salt,hashes){
  text=String(text||'');
  const spans=[];
  const add=(re,fn,kind)=>{re.lastIndex=0;let m;while((m=re.exec(text))!==null){if(!m[0]){re.lastIndex++;continue;}spans.push({s:m.index,e:m.index+m[0].length,rep:fn(m),kind});}};
  add(/[\w.+-]+@[\w-]+\.[\w.]+/g,()=>'(메일)','contact');
  add(/@[A-Za-z0-9_.]{3,}/g,()=>'(아이디)','contact');
  add(/\d[\d\-\s.]{6,}\d/g,()=>'(번호)','contact');
  add(/\d+\s*동\s*\d+\s*호/g,()=>'(사는 곳)','place');
  add(/[가-힣A-Za-z0-9]*(?:아파트|빌라|맨션|오피스텔)/g,()=>'(사는 곳)','place');
  add(/\d{1,2}\s*번\s*친구/g,()=>'친구','num');
  add(/\d{1,2}\s*번(이가|이는|이랑|이한테|이를|이도|이의|한테|아|이)(?![나라면])/g,m=>NUMMAP[m[1]]||'친구','num');
  if(salt&&hashes&&hashes.size){
    const runRe=/[가-힣A-Za-z]+/g;let m;
    while((m=runRe.exec(text))!==null){
      const run=m[0].toLowerCase(),base=m.index;
      if(run.length<2)continue;
      const jobs=[];
      for(let i=0;i<run.length;i++)for(let L=2;L<=Math.min(8,run.length-i);L++)jobs.push([i,L]);
      const hs=await Promise.all(jobs.map(([i,L])=>nameKey(run.substr(i,L),salt)));
      const hit=new Map();
      jobs.forEach(([i,L],k)=>{if(hashes.has(hs[k])&&L>(hit.get(i)||0))hit.set(i,L);});
      for(let i=0;i<run.length;i++){const L=hit.get(i);if(L){spans.push({s:base+i,e:base+i+L,rep:null,kind:'name'});i+=L-1;}}
    }
  }
  spans.sort((a,b)=>a.s-b.s||(b.e-b.s)-(a.e-a.s));
  let out='',html='',pos=0,count=0;
  for(const sp of spans){
    if(sp.s<pos)continue;
    let rep=sp.rep,end=sp.e;
    if(sp.kind==='name'){
      rep='친구';
      if(hasBatchim(text[end-1])){
        const n1=text[end]||'',n2=text.slice(end,end+2);
        if(n2==='으로'){rep='친구로';end+=2;}
        else if(n1==='이'){end+=1;}
        else if(n1==='아'&&!isHangul(text[end+1]||'')){rep='친구야';end+=1;}
        else if(n1==='은'){rep='친구는';end+=1;}
        else if(n1==='을'){rep='친구를';end+=1;}
        else if(n1==='과'){rep='친구와';end+=1;}
      }
    }
    out+=text.slice(pos,sp.s)+rep;
    html+=esc(text.slice(pos,sp.s))+'<mark>'+esc(rep)+'</mark>';
    pos=end;count++;
  }
  out+=text.slice(pos);html+=esc(text.slice(pos));
  return {out,html,count};
}
function countSentences(s){return String(s).split(/[.!?…]+/).map(x=>x.trim()).filter(x=>x.length>1).length;}
function endPunct(s){s=String(s||'').trim();return s&&!/[.!?…~]$/.test(s)?s+'.':s;}
function joinParts(p){return p?[p.sit,p.feel,p.req].map(x=>String(x||'').trim()).filter(Boolean).join(' '):'';}
function partsHtml(p){
  if(!p)return '';
  const seg=[['u1',p.sit],['u2',p.feel],['u3',p.req]].filter(([,t])=>String(t||'').trim());
  return seg.map(([c,t])=>'<span class="'+c+'">'+esc(String(t).trim())+'</span>').join(' ');
}
const stripLead=s=>String(s||'').replace(/^\s*(?:[①②③]|\d[.)]|[-•*])\s*/,'').replace(/^["“'‘]+|["”'’]+$/g,'').trim();
/* AI 제안 검사: 3개, 각각 상황·기분·부탁 3부분, 2문장 이하, 금칙어·위험어 없음, 남은 이름은 다시 가림 */
async function cleanSuggestions(arr,salt,hashes){
  if(!Array.isArray(arr)||arr.length<3)return null;
  const out=[];
  for(const x of arr.slice(0,3)){
    if(!x||typeof x!=='object')return null;
    let p={sit:stripLead(x.situation||x.sit||x['상황']),feel:stripLead(x.feeling||x.feel||x['감정']),req:stripLead(x.request||x.req||x['부탁'])};
    if(p.sit.length<2||p.feel.length<2||p.req.length<2)return null;
    p.feel=endPunct(p.feel);
    const full=joinParts(p);
    if(full.length<8||full.length>120)return null;
    if(countSentences(full)>2)return null;
    if(badWord(full,true)||checkDanger(full))return null;
    p={sit:(await maskText(p.sit,salt,hashes)).out,feel:(await maskText(p.feel,salt,hashes)).out,req:(await maskText(p.req,salt,hashes)).out};
    out.push(p);
  }
  if(new Set(out.map(joinParts)).size<3)return null;
  return out;
}

const pad=n=>String(n).padStart(2,'0');
function dayKey(ts){const d=new Date(ts||Date.now());return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function fmtTime(ts){const d=new Date(ts);return pad(d.getHours())+':'+pad(d.getMinutes());}
const WEEK='일월화수목금토';
function fmtDay(ts){const d=new Date(ts);return (d.getMonth()+1)+'/'+d.getDate()+'('+WEEK[d.getDay()]+')';}
function todayLabel(){const d=new Date();return d.getFullYear()+'. '+(d.getMonth()+1)+'. '+d.getDate()+'. ('+WEEK[d.getDay()]+')';}
function randHex(n){const a=new Uint8Array(n);crypto.getRandomValues(a);return Array.from(a).map(x=>x.toString(16).padStart(2,'0')).join('');}
async function withRetry(fn){try{return await fn();}catch(e){if(e&&e.code==='unavailable'){await sleep(600+Math.random()*800);return await fn();}throw e;}}
function withLabel(c){

function withShort(c){

  if(c.withType==='skip')return '→ 안 밝힘';

}

/* ===== 저장소: 링크(claude.ai)로 열면 여러 기기가 함께 쓰는 저장소, 파일로 열면 이 기기 브라우저 ===== */
function cloudStore(db){
  const map=s=>s.docs.map(d=>Object.assign({},d.data(),{id:d.id}));
  return {
    kind:'cloud',
    watchSettings(cb,err){return db.doc('malang/settings').onSnapshot(s=>cb(s.exists?s.data():null,s.metadata.fromCache),err);},
    setSettings(obj){return withRetry(()=>db.doc('malang/settings').set(obj));},
    add(coll,doc){return withRetry(()=>db.collection(coll).add(doc));},
    update(coll,id,patch){return withRetry(()=>db.doc(coll+'/'+id).update(patch));},
    remove(coll,id){return withRetry(()=>db.doc(coll+'/'+id).delete());},
    watch(coll,limit,cb,err){return db.collection(coll).orderBy('createdAt','desc').limit(limit).onSnapshot(s=>cb(map(s),s.metadata.fromCache),err);}
  };
}
function localStore(){
  const KEY='malang-local-v1';
  let persist=false;
  try{localStorage.setItem(KEY+'-t','1');localStorage.removeItem(KEY+'-t');persist=true;}catch(e){}
  const read=()=>{try{const r=JSON.parse(localStorage.getItem(KEY)||'null');if(r&&typeof r==='object')return {settings:r.settings||null,cards:r.cards||{},alerts:r.alerts||{}};}catch(e){}return {settings:null,cards:{},alerts:{}};};
  let data=persist?read():{settings:null,cards:{},alerts:{}};
  const subs={settings:new Set(),cards:new Set(),alerts:new Set()};
  const write=()=>{if(!persist)return;try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){throw {code:'quota_exceeded'};}};
  const list=(coll,limit)=>Object.keys(data[coll]).map(id=>Object.assign({},data[coll][id],{id})).sort((a,b)=>b.createdAt-a.createdAt).slice(0,limit);
  const emit=coll=>{if(coll==='settings')subs.settings.forEach(f=>f(data.settings,false));else subs[coll].forEach(o=>o.cb(list(coll,o.limit),false));};
  if(persist){try{window.addEventListener('storage',e=>{if(e.key===KEY){data=read();emit('settings');emit('cards');emit('alerts');}});}catch(e){}}
  return {
    kind:persist?'local':'memory',
    watchSettings(cb){subs.settings.add(cb);setTimeout(()=>cb(data.settings,false),0);return ()=>subs.settings.delete(cb);},
    async setSettings(obj){const prev=data.settings;data.settings=obj;try{write();}catch(e){data.settings=prev;throw e;}emit('settings');},
    async add(coll,doc){const id=randHex(8);data[coll][id]=doc;try{write();}catch(e){delete data[coll][id];throw e;}emit(coll);},
    async update(coll,id,patch){if(!data[coll][id])throw {code:'invalid_argument'};data[coll][id]=Object.assign({},data[coll][id],patch);write();emit(coll);},
    async remove(coll,id){delete data[coll][id];write();emit(coll);},
    watch(coll,limit,cb){const o={cb,limit};subs[coll].add(o);setTimeout(()=>cb(list(coll,limit),false),0);return ()=>subs[coll].delete(o);}
  };
}

let Store=null;
const P={sample:null,user:null,dbState:'loading',canWrite:null,settings:null,settingsState:'loading'};
const hashSet=()=>new Set((P.settings&&P.settings.nameHashes)||[]);
const saltOf=()=>(P.settings&&P.settings.salt)||null;
function classSize(){const n=Number(P.settings&&P.settings.classSize);return n>=5&&n<=40?n:30;}

function initPlatform(){
  const c=window.claude;
  if(!c||typeof c.use!=='function'){useLocal();return;}
  c.use('sample').then(s=>{P.sample=s||null;onPlatform();}).catch(()=>{});
  c.use('user').then(async u=>{P.user=u||null;if(u&&typeof u.canEdit==='function'){try{const v=await u.canEdit();if(typeof v==='boolean')P.canWrite=v;}catch(e){}}onPlatform();}).catch(()=>{});
  c.use('db').then(d=>{
    if(!d){useLocal();return;}
    Store=cloudStore(d);P.dbState='cloud';subscribeSettings();
  }).catch(()=>useLocal());
}
function useLocal(){Store=localStore();P.dbState=Store.kind;subscribeSettings();}
function subscribeSettings(){
  const timer=setTimeout(()=>{if(P.settingsState==='loading'){P.settingsState='slow';onPlatform();}},10000);
  Store.watchSettings((data,fromCache)=>{
    if(data){P.settings=data;P.settingsState='ok';}
    else if(!fromCache){P.settings=null;P.settingsState='empty';}
    if(!fromCache)clearTimeout(timer);
    onPlatform();
  },()=>{clearTimeout(timer);P.settingsState='error';onPlatform();});
}
function onPlatform(){
  if(MODE==='student'&&SCREEN==='start')render();
  else if(MODE==='pin')render();
  else if(MODE==='teacher')refreshTeacher();
}
async function saveSettings(patch){
  const next=Object.assign({},P.settings||{},patch,{updatedAt:Date.now()});
  await Store.setSettings(next);
  P.settings=next;
}

async function raiseAlert(d,stage){
  S.alert={cat:d.cat};S.alertSaved='saving';
  const doc={no:S.no,withNo:S.withNo||null,cat:d.cat,label:d.label,word:d.word,stage:stage,sit:S.sit,emo:S.emo,wish:S.wish,createdAt:Date.now(),day:dayKey(),resolved:false};

  catch(e){S.alertSaved='fail';}
  if(SCREEN==='stop')render();
}
async function getSuggestions(){
  const token=S.id;
  const sit=findIn(SITUATIONS,S.sit),emo=findIn(EMOTIONS,S.emo),wish=findIn(WISHES,S.wish);
  S.pick=null;S.sugNote='';
  go('loading');
  let result=null,source='template',errCode=null;
  if(P.sample){
    for(let attempt=0;attempt<2&&!result;attempt++){
      try{
        const v=await P.sample.json(buildPrompt(sit,emo,wish,S.mWhat,S.mText),{modelTier:'quick',cache:false});
        const arr=v&&Array.isArray(v.suggestions)?v.suggestions:(Array.isArray(v)?v:null);
        result=await cleanSuggestions(arr,saltOf(),hashSet());
        if(result)source='ai';
      }catch(e){
        errCode=e&&e.code;
        if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed','rate_limited','session_expired','refused'].includes(errCode))break;
      }
      if(S.id!==token)return;
    }
  }else await sleep(700);
  if(S.id!==token)return;
  if(!result){
    result=templateSuggestions(sit,emo,wish);source='template';
    S.sugNote=!P.sample?'말랑이가 고른 버튼으로 나-전달법 문장을 만들었어요. 내 말로 고쳐 써도 좋아요.'
      :errCode==='rate_limited'?'지금은 말랑이가 잠깐 쉬어야 해서, 고른 버튼으로 기본 문장을 만들었어요. 고쳐 써도 좋아요.'
      :'지금은 말랑이가 대답하지 못해서, 고른 버튼으로 기본 문장을 만들었어요. 고쳐 써도 좋아요.';
  }
  S.sugs=result;S.sugSource=source;
  if(SCREEN==='loading')go('choose');
}
async function onEditDone(){
  const joined=joinParts(S.fp).trim();
  if(joined.length<4)return;
  const d=checkDanger(joined);
  if(d)return raiseAlert(d,'마음 카드 고쳐 쓰기');
  if(badWord(joined,false)){
    S.editNote='이 카드는 친구에게 보여 줄 거라서, 거친 말은 빼고 다시 써 볼까? 기분은 ‘속상했어’, ‘화가 났어’처럼 말해도 충분해.';
    return go('edit');
  }
  const salt=saltOf(),hs=hashSet();
  const m1=await maskText(S.fp.sit.trim(),salt,hs),m2=await maskText(S.fp.feel.trim(),salt,hs),m3=await maskText(S.fp.req.trim(),salt,hs);
  const parts={sit:m1.out,feel:endPunct(m2.out),req:m3.out};
  if(m1.count+m2.count+m3.count>0&&S.editNote.indexOf('바꿨어요')<0){
    S.fp=parts;
    S.editNote='이름이나 번호가 있어서 ‘친구’로 바꿨어요. 확인하고 한 번 더 눌러 주세요.';
    return go('edit');
  }
  if(!S.fp.req.trim()&&S.editNote.indexOf('③')<0){
    S.editNote='③ 부탁 칸이 비어 있어요. 비워 둬도 되지만, 채우면 친구가 내 마음을 더 잘 알아요. 이대로 하려면 한 번 더 눌러 주세요.';
    return go('edit');
  }
  const sit=findIn(SITUATIONS,S.sit),emo=findIn(EMOTIONS,S.emo),wish=findIn(WISHES,S.wish);
  const flags=[];
  [sit,emo,wish].forEach(x=>{if(x&&x.flag)flags.push(x.flag);});
  textFlags(S.what+' '+S.text+' '+joined).forEach(f=>flags.push(f));
  const sentence=joinParts(parts);
  const card={no:S.no,withNo:S.withNo||null,withType:S.withNo?'one':(S.withType||null),sit:S.sit,what:S.mWhat||'',emo:S.emo,wish:S.wish,parts:parts,sentence:sentence,
    flags:Array.from(new Set(flags)),ai:S.sugSource==='ai',edited:S.pick==null||sentence!==joinParts(S.sugs[S.pick]),createdAt:Date.now(),day:dayKey(),status:'new'};
  /* 처음 쓴 '하고 싶은 말'(원문)은 여기서 버린다 */
  S.text='';S.what='';S.mText='';S.mTextHtml='';S.mWhatHtml='';
  S.card=card;S.saved='saving';
  go('card');
  try{if(!Store)throw {code:'nodb'};await Store.add('cards',card);S.saved='ok';}
  catch(e){S.saved=e&&e.code==='quota_exceeded'?'full':'fail';}
  const el=document.getElementById('saveSt');if(el&&SCREEN==='card')el.innerHTML=saveStatusHtml();
}
function onNext(){
  switch(SCREEN){
    case 'number':if(S.no){if(S.withNo===S.no)S.withNo=null;go('friend');}break;
    case 'friend':if(S.withNo||S.withType)go('situation');break;
    case 'situation':if(S.sit)go('what');break;
    case 'what':onWhatDone();break;
    case 'emotion':if(S.emo)go('breathe');break;
    case 'breathe':go('wish');break;
    case 'wish':if(S.wish)go('write');break;
    case 'write':onWriteDone();break;

    case 'choose':if(S.pick!=null){S.fp=Object.assign({},S.sugs[S.pick]);S.editNote='';go('edit');}break;
    case 'edit':onEditDone();break;
  }
}

  return '<main class="pin">'+mascot('calm',90)+'<h1 id="q" tabindex="-1">'+title+'</h1><p>'+desc+'</p><div id="pinAlert">'+pinAlertHtml()+'</div>'
    +'<div class="pin-dots" id="pinDots" aria-label="입력한 자리 '+T.pin.length+'개">'+dots+'</div><p class="pin-msg" role="status">'+esc(T.pinMsg)+'</p>'
    +'<div class="keypad">'+keys+'</div></main>';
}
async function pinKey(k){
  if(Date.now()<T.lockUntil||!Store)return;
  if(P.settingsState==='loading'||P.settingsState==='slow'||P.settingsState==='error')return;
  if(k==='del'){T.pin=T.pin.slice(0,-1);return render();}
  if(T.pin.length>=4)return;
  T.pin+=k;render();
  if(T.pin.length<4)return;
  const pin=T.pin;T.pin='';
  const hasPin=!!(P.settings&&P.settings.pinHash);
  if(!hasPin){
    if(T.pinStage!=='setup2'){T.pinFirst=pin;T.pinStage='setup2';T.pinMsg='';return render();}
    if(pin!==T.pinFirst){T.pinStage='setup1';T.pinFirst='';T.pinMsg='두 번 누른 번호가 달라요. 처음부터 다시 정해 주세요.';return render();}
    const base=P.settings||{};
    const salt=base.salt||randHex(16);
    const doc=Object.assign({classSize:30,nameHashes:[],nameEntries:0,createdAt:Date.now()},base,{salt:salt,pinHash:await sha(salt+'|pin|'+pin),updatedAt:Date.now()});
    try{await Store.setSettings(doc);P.settings=doc;P.settingsState='ok';}
    catch(e){T.pinStage='setup1';T.pinMsg='저장하지 못했어요. 이 계정(또는 브라우저)에 저장 권한이 있는지 확인해 주세요.';return render();}
    return enterTeacher(true);
  }
  const h=await sha(P.settings.salt+'|pin|'+pin);
  if(h===P.settings.pinHash){T.fails=0;T.pinMsg='';return enterTeacher(false);}
  T.fails++;
  if(T.fails>=5){T.fails=0;T.lockUntil=Date.now()+30000;T.pinMsg='5번 틀려서 30초 동안 잠가요.';setTimeout(()=>{if(MODE==='pin'){T.pinMsg='';render();}},30200);}
  else T.pinMsg='비밀번호가 달라요. 다시 눌러 주세요.';
  render();
  const d=document.getElementById('pinDots');if(d){d.classList.remove('shake');void d.offsetWidth;d.classList.add('shake');}
}

let unsubC=null,unsubA=null,loadTimer=null,titleTimer=null;
function startTeacherData(){
  if(!Store||unsubC)return;
  T.cardsLoaded=false;T.alertsLoaded=false;T.loadSlow=false;T.loadErr=null;T.seen=null;
  loadTimer=setTimeout(()=>{if(!T.cardsLoaded){T.loadSlow=true;refreshTeacher();}},10000);
  unsubC=Store.watch('cards',1000,(list,fromCache)=>{
    T.cards=list;
    if(!fromCache){T.cardsLoaded=true;T.loadSlow=false;clearTimeout(loadTimer);}
    refreshTeacher();
  },e=>{T.loadErr=(e&&e.code)||'error';clearTimeout(loadTimer);refreshTeacher();});
  unsubA=Store.watch('alerts',300,(list,fromCache)=>{
    if(T.seen){const fresh=list.filter(a=>!a.resolved&&!T.seen.has(a.id));if(fresh.length)notifyAlert();}
    T.seen=new Set(list.map(a=>a.id));
    T.alerts=list;if(!fromCache)T.alertsLoaded=true;
    refreshTeacher();
  },e=>{T.loadErr=(e&&e.code)||'error';refreshTeacher();});
}
function stopTeacherData(){
  if(unsubC)unsubC();if(unsubA)unsubA();unsubC=unsubA=null;
  clearTimeout(loadTimer);stopTitleFlash();
  T.cards=[];T.alerts=[];T.seen=null;T.recon=[];T.reconStep=0;T.selNo=null;T.confirm=null;T.testHtml='';T.aiMsg='';
}

/* 서로를 고른 카드 짝: A가 B를, B가 A를 고른 면담 전 카드 (최근 14일) */
let pairMemo={src:null,val:[]};
function findPairs(){
  if(pairMemo.src===T.cards)return pairMemo.val;
  const since=Date.now()-14*864e5;
  const pend=T.cards.filter(c=>c.status!=='done'&&c.withNo&&c.createdAt>=since);
  const pairs=[],used=new Set();
  for(const a of pend){
    if(used.has(a.id))continue;
    const b=pend.find(x=>x.id!==a.id&&!used.has(x.id)&&x.no===a.withNo&&x.withNo===a.no);
    if(b){used.add(a.id);used.add(b.id);pairs.push(a.createdAt<=b.createdAt?[a,b]:[b,a]);}
  }
  pairMemo={src:T.cards,val:pairs};
  return pairs;
}
function pairOf(c){const p=findPairs().find(([a,b])=>a.id===c.id||b.id===c.id);return p?(p[0].id===c.id?p[1]:p[0]):null;}

async function tUpdate(coll,id,patch){try{await Store.update(coll,id,patch);}catch(e){toast('저장하지 못했어요. 잠시 뒤 다시 해 주세요.');}}
async function tDelete(coll,id){try{await Store.remove(coll,id);return true;}catch(e){toast('지우지 못했어요. 잠시 뒤 다시 해 주세요.');return false;}}
async function bulkDelete(items){
  let n=0;
  for(const [coll,id] of items){if(MODE!=='teacher')break;if(await tDelete(coll,id))n++;if(n&&n%10===0)toast('지우는 중… '+n+' / '+items.length);}
  toast(n+'건을 지웠어요.');
}
async function aiTest(){
  const out=m=>{T.aiMsg=m;const el=document.getElementById('aiMsg');if(el)el.textContent=m;};
  if(!P.sample){out('이 기기에서는 AI를 쓸 수 없어요. claude.ai에 로그인한 상태로 링크를 열었는지 확인해 주세요.');return;}
  out('확인 중… ‘허용’을 묻는 창이 뜨면 허용해 주세요.');
  try{
    const v=await P.sample.json('다음 JSON만 그대로 답해: {"ok": true}',{modelTier:'quick',cache:false});
    out(v&&v.ok?'✓ 연결됐어요. 이 기기에서 말랑이가 문장을 만들 수 있어요.':'✓ 응답이 왔어요. 이 기기에서 쓸 수 있어요.');
  }catch(e){
    const c=e&&e.code;
    out(c==='not_granted'?'허용이 꺼져 있어요. 페이지를 다시 열고 허용 창에서 ‘허용’을 눌러 주세요. (꺼져 있어도 기본 문장으로는 쓸 수 있어요)'
      :c==='sampling_disabled'?'이 계정(또는 학교)에서는 AI 사용이 꺼져 있어요. 학생들은 기본 문장으로만 쓸 수 있어요.'
      :c==='rate_limited'?'지금은 사용량이 많아 잠시 쉬어야 해요. 조금 뒤 다시 확인해 주세요.'
      :c==='session_expired'?'로그인이 끝났어요. 다시 로그인해 주세요.'
      :'연결하지 못했어요. 잠시 뒤 다시 확인해 주세요.');
  }
}

let toastTimer=null;
function toast(msg){let el=document.getElementById('toast');if(!el){el=document.createElement('div');el.id='toast';el.className='toast';el.setAttribute('role','status');document.body.appendChild(el);}el.textContent=msg;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{el.hidden=true;},2600);}
function modal(html){closeModal();const bg=document.createElement('div');bg.className='modal-bg';bg.id='modal';bg.innerHTML='<div class="modal" role="dialog" aria-modal="true">'+html+'</div>';document.body.appendChild(bg);const f=bg.querySelector('button');if(f)f.focus();}
function closeModal(){const m=document.getElementById('modal');if(m)m.remove();}
async function copyText(txt){
  try{await navigator.clipboard.writeText(txt);toast('복사했어요. 상담 기록에 붙여 넣으세요.');}
  catch(e){modal('<h2>아래 내용을 복사해 주세요</h2><textarea id="copyBox" readonly>'+esc(txt)+'</textarea><div class="row"><button type="button" class="btn primary sm" data-act="modal-close">닫기</button></div>');const b=document.getElementById('copyBox');if(b){b.focus();b.select();}}
}

/* ===== 그리기 ===== */
function render(){
  const key=MODE+':'+SCREEN;
  let html;
  if(MODE==='teacher')html=screenTeacher();
  else if(MODE==='pin')html=screenPin();
  else html=renderStudent();
  app.innerHTML=html;
  S.squish=false;
  if(key!==lastKey){
    window.scrollTo(0,0);lastKey=key;
    const tx=document.getElementById('wx')||document.getElementById('tx');
    if(tx){tx.focus();const L=tx.value.length;try{tx.setSelectionRange(L,L);}catch(e){}}
    else{const q=document.getElementById('q');if(q)q.focus({preventScroll:true});}
  }
}

/* ===== 입력 처리 ===== */
function liveWarn(v){
  const w=document.getElementById('liveWarn');if(!w)return;
  let msg='';
  if(/\d{3,}/.test(v))msg='숫자(전화번호 같은 것)는 쓰지 않아도 돼요.';
  else if(/\d{1,2}\s*번/.test(v))msg='친구 출석번호를 썼다면 ‘친구’로 바꿔 써요.';
  else if(/@/.test(v))msg='아이디나 메일 주소는 쓰지 않아요.';
  w.innerHTML=msg?'<p class="note warn">'+msg+'</p>':'';
}
app.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='tx'){
    S.text=t.value;
    const c=document.getElementById('cnt');if(c)c.textContent=t.value.length+' / 100';
    const nb=document.getElementById('nextBtn');if(nb)nb.disabled=t.value.trim().length<2;
    liveWarn(t.value);
  }else if(t.id==='wx'){
    S.what=t.value;
    const c=document.getElementById('cnt');if(c)c.textContent=t.value.length+' / 120';
    const nb=document.getElementById('nextBtn');if(nb)nb.textContent=t.value.trim()?'다 썼어요 →':'안 쓰고 넘어갈래요 →';
    liveWarn(t.value);
  }else if(t.id==='f1'||t.id==='f2'||t.id==='f3'){
    S.fp[t.id==='f1'?'sit':t.id==='f2'?'feel':'req']=t.value;
    const pv=document.getElementById('preview');if(pv)pv.innerHTML=partsHtml(S.fp)||'<span class="muted">세 칸에 말을 써 주세요.</span>';
    const nb=document.getElementById('nextBtn');if(nb)nb.disabled=joinParts(S.fp).length<4;
  }
});

document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const act=b.dataset.act,v=b.dataset.v,id=b.dataset.id;
  switch(act){
    /* 학생 */
    case 'begin':S=fresh();go('number');break;
    case 'teacher':openTeacher();break;
    case 'no':S.no=Number(v);S.squish=true;render();break;
    case 'with':S.withNo=Number(v);S.withType=null;S.squish=true;render();break;
    case 'withtype':S.withType=v;S.withNo=null;S.squish=true;render();break;
    case 'sit':S.sit=v;S.squish=true;render();break;
    case 'emo':S.emo=v;S.squish=true;render();break;
    case 'wish':S.wish=v;S.squish=true;render();break;
    case 'dontknow':S.text='뭐라고 말해야 할지 잘 모르겠어.';render();break;
    case 'pick':S.pick=Number(b.dataset.i);render();break;
    case 'regen':if(S.regen<2){S.regen++;getSuggestions();}break;
    case 'rewrite':go('write');break;
    case 'back':if(BACK[SCREEN])go(BACK[SCREEN]);break;
    case 'next':onNext();break;
    case 'finish':resetToStart();break;
    case 'bigview':openBigView();break;
    case 'quit':
      modal('<h2>처음으로 갈까요?</h2><p>지금까지 고르고 쓴 내용은 지워져요.</p><div class="row"><button type="button" class="btn ghost sm" data-act="modal-close">계속하기</button><button type="button" class="btn primary sm" data-act="quit-yes">처음으로</button></div>');break;
    case 'quit-yes':closeModal();resetToStart();break;
    case 'modal-close':closeModal();break;
    /* 비밀번호 */
    case 'pinkey':pinKey(v);break;
    case 'pincancel':stopTeacherData();resetToStart();break;
    /* 교사 */
    case 't-lock':lockTeacher();break;
    case 't-exit':exitTeacher();break;
    case 't-tab':T.tab=v;T.confirm=null;render();break;
    case 't-period':T.period=v;setHTML('tBody',bodyHtml());break;
    case 't-no':T.selNo=T.selNo===Number(v)?null:Number(v);setHTML('tBody',bodyHtml());break;
    case 't-copy-no':if(T.selNo)copyText(copyTextFor(T.selNo));break;
    case 't-done':{const c=T.cards.find(x=>x.id===id);if(c)tUpdate('cards',id,c.status==='done'?{status:'new',doneAt:null}:{status:'done',doneAt:Date.now()});break;}
    case 't-recon':{
      if(T.recon.includes(id))T.recon=T.recon.filter(x=>x!==id);
      else{if(T.recon.length>=2){toast('화해 대화에는 2장까지 담을 수 있어요.');break;}T.recon.push(id);T.reconStep=0;if(T.recon.length===2)toast('2장을 담았어요. ‘화해 대화’ 탭에서 시작하세요.');}
      setHTML('tTabs',tabsHtml());setHTML('tBody',bodyHtml());break;}
    case 't-pair':T.recon=[b.dataset.a,b.dataset.b];T.reconStep=0;T.tab='recon';render();break;
    case 't-rstep':T.reconStep=Math.max(0,Math.min(RECON_STEPS.length-1,T.reconStep+Number(v)));setHTML('tBody',bodyHtml());break;
    case 't-recon-done':{const ids=T.recon.slice();T.recon=[];T.reconStep=0;for(const x of ids)await tUpdate('cards',x,{status:'done',doneAt:Date.now()});toast('면담 완료로 표시했어요.');render();break;}
    case 't-recon-clear':T.recon=[];T.reconStep=0;render();break;
    case 't-del':T.confirm='del:'+id;setHTML('tBody',bodyHtml());break;
    case 't-del-yes':T.confirm=null;T.recon=T.recon.filter(x=>x!==id);await tDelete('cards',id);break;
    case 't-cancel':T.confirm=null;if(T.tab==='settings')render();else setHTML('tBody',bodyHtml());break;
    case 't-resolve':await tUpdate('alerts',id,{resolved:true,resolvedAt:Date.now()});stopTitleFlash();break;
    case 't-size':{const n=Math.round(Number((document.getElementById('sizeIn')||{}).value));if(!(n>=5&&n<=40)){toast('5부터 40 사이로 적어 주세요.');break;}try{await saveSettings({classSize:n});toast('학급 인원을 '+n+'명으로 저장했어요.');render();}catch(err){toast('저장하지 못했어요.');}break;}
    case 't-names-add':{
      const ta=document.getElementById('namesIn');const r=nameVariants(ta?ta.value:'');
      if(!r.entries){toast('두 글자 이상인 이름이나 별명을 적어 주세요.');break;}
      b.disabled=true;
      try{
        const hs=await Promise.all(r.variants.map(x=>nameKey(x,P.settings.salt)));
        const merged=Array.from(new Set(((P.settings&&P.settings.nameHashes)||[]).concat(hs)));
        await saveSettings({nameHashes:merged,nameEntries:((P.settings&&P.settings.nameEntries)||0)+r.entries});
        if(ta)ta.value='';toast(r.entries+'개를 등록했어요. 원래 글자는 저장하지 않았어요.');render();
      }catch(err){toast('등록하지 못했어요.');b.disabled=false;}
      break;}
    case 't-names-clear':T.confirm='names-clear';render();break;
    case 't-names-clear-yes':T.confirm=null;try{await saveSettings({nameHashes:[],nameEntries:0});toast('등록한 이름을 모두 지웠어요.');}catch(err){toast('지우지 못했어요.');}render();break;
    case 't-test':{const inp=document.getElementById('testIn');const m=await maskText(inp?inp.value:'',saltOf(),hashSet());T.testHtml=m.html||'<span class="muted">글을 적어 주세요.</span>';setHTML('testOut',T.testHtml+(m.count?' <span class="muted">('+m.count+'곳 가림)</span>':' <span class="muted">(가린 곳 없음)</span>'));break;}
    case 't-ai':aiTest();break;
    case 't-pin':{const inp=document.getElementById('pinIn');const p=inp?inp.value.trim():'';if(!/^\d{4}$/.test(p)){toast('숫자 4자리를 적어 주세요.');break;}try{await saveSettings({pinHash:await sha(P.settings.salt+'|pin|'+p)});inp.value='';toast('비밀번호를 바꿨어요.');}catch(err){toast('바꾸지 못했어요.');}break;}
    case 't-clean-old':T.confirm='clean-old';render();break;
    case 't-clean-all':T.confirm='clean-all';render();break;
    case 't-clean-old-yes':{T.confirm=null;const since=Date.now()-30*864e5;const items=T.cards.filter(c=>c.createdAt<since).map(c=>['cards',c.id]).concat(T.alerts.filter(a=>a.createdAt<since).map(a=>['alerts',a.id]));render();await bulkDelete(items);break;}
    case 't-clean-all-yes':{T.confirm=null;const items=T.cards.map(c=>['cards',c.id]).concat(T.alerts.map(a=>['alerts',a.id]));T.recon=[];render();await bulkDelete(items);break;}
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeModal();
  if(MODE==='pin'&&/^[0-9]$/.test(e.key))pinKey(e.key);
  if(MODE==='pin'&&e.key==='Backspace')pinKey('del');
});

/* ===== 자리 비움 처리 (공용 기기에서 다음 학생이 앞 학생 글을 보지 않도록) ===== */
let lastAct=Date.now();
['pointerdown','keydown','input'].forEach(ev=>document.addEventListener(ev,()=>{lastAct=Date.now();if(titleTimer&&MODE==='teacher')stopTitleFlash();},{passive:true,capture:true}));
setInterval(()=>{
  const idle=Date.now()-lastAct;
  if(MODE==='student'){
    if(SCREEN==='start'||SCREEN==='stop'||SCREEN==='loading')return;
    const limit=SCREEN==='card'?120e3:240e3;
    if(idle>limit)resetToStart();
    else if(idle>limit-30e3&&SCREEN!=='card')toast('아직 하고 있나요? 화면을 누르면 이어서 할 수 있어요.');
  }else if(MODE==='teacher'&&idle>15*60e3)lockTeacher();
},5000);

render();
initPlatform();
})();
</script>
